<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <main>
        <button onclick="loginmodal.showModal()">Login</button>
    </main>

    <dialog id="loginmodal">
        <form>
            <label for="email">E-mail</label>
            <input type="email" required id="email" name="email"> <br>
        
            <label for="Senha">Senha</label>
            <input type="password" required name="Senha" id="Senha"> <br>
            
            <button>Entrar</button>
            <button onclick="loginmodal.close()">Fechar</button>

        </form>
    </dialog>
    
</body>
</html>
